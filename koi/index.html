    <title>Nagomi — Interactive Koi Pond</title>
    <script>
(function() {
  // Auto-set weather based on local time
  const hour = new Date().getHours();
  let weather = "sunny";
  if (hour >= 6 && hour < 10) weather = "sunny";
  else if (hour >= 10 && hour < 16) weather = "deep-clear";
  else if (hour >= 16 && hour < 18) weather = "sunset";
  else if (hour >= 18 && hour < 20) weather = "sunset";
  else weather = "moonlight";

  // Override any UI/controls/settings
  try {
    const saved = JSON.parse(localStorage.getItem("mizukoi:pond-settings:v2") || "{}");
    saved.version = 2;
    saved.weather = weather;
    saved.rain = false;
    if (!saved.overrides) saved.overrides = {};
    localStorage.setItem("mizukoi:pond-settings:v2", JSON.stringify(saved));
  } catch(e) {}

  // Aggressively remove ALL UI controls after render
  function purgeUI(root) {
    if (!root) return;
    root.querySelectorAll("button, [role=button], [role=dialog], [role=menu], .btn, [class*=button], [class*=control], [class*=settings], [class*=drawer], [class*=menu], [class*=kbd], [class*=separator], [class*=switch], .weather-trigger, .weather-menu, .config-editor, .quick-settings, .settings-controls").forEach(el => {
      el.remove();
    });
    // Hide fixed/absolute positioned UI elements (small ones)
    root.querySelectorAll("*").forEach(el => {
      const s = getComputedStyle(el);
      if ((s.position === "fixed" || s.position === "absolute") && el.offsetWidth < 400 && el.offsetHeight < 200) {
        el.remove();
      }
    });
  }

  const root = document.getElementById("root");
  if (root) {
    purgeUI(root);
    const mo = new MutationObserver(() => purgeUI(root));
    mo.observe(root, { childList: true, subtree: true });
  }
  // Fallback: also observe body
  const mo2 = new MutationObserver(() => purgeUI(document.body));
  mo2.observe(document.body, { childList: true, subtree: true });
})();
</script>
