server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss;
    gzip_comp_level 6;
    
    location ~* \.(css|js|json|svg|woff2?|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }
    
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary "Accept-Encoding";
    }
    
    location = /index.html {
        add_header Link "<https://fonts.googleapis.com>; rel=preconnect; crossorigin" always;
        add_header Link "<https://fonts.gstatic.com>; rel=preconnect; crossorigin" always;
        add_header Link "<assets/style.css>; rel=preload; as=style" always;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}